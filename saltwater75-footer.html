<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1f26">
<title>Footer | Saltwater 75</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens ---------- */
/* The full set the other pages carry, trimmed to what a footer touches. */
:root {
	--ink:        #0b1f26;   /* deep ocean */
	--sand:       #f6efe4;   /* cream text */
	--sand-dim:   #cfe0dd;
	--gold:       #e8a04b;   /* sunset */
	--gold-2:     #f2c078;
	--line:       rgba(246,239,228,.14);
	--maxw:       1180px;
	--shadow:     0 18px 45px rgba(0,0,0,.35);
	--head:       'Playfair Display', Georgia, serif;
	--body:       'Montserrat', 'Helvetica Neue', Arial, sans-serif;
}

/* ---------- Reset-ish ---------- */
*, *::before, *::after { box-sizing: border-box; }
body {
	margin: 0;
	font-family: var(--body);
	color: var(--sand);
	/* --ink, the page's own shade, rather than the near-black #06151a the
	   footer uses at the bottom of the full pages: standing on its own the
	   darker one read as a heavy black band. Set on the body as well as the
	   footer, so the widget stays this colour edge to edge however tall Wix
	   draws the box. */
	background: var(--ink);
	line-height: 1.65;
	-webkit-font-smoothing: antialiased;
}
html, body { overflow-x: hidden; max-width: 100%; }
img { max-width: 100%; height: auto; display: block; }
a { color: var(--gold-2); text-decoration: none; transition: color .2s ease; }
a:hover { color: var(--gold); }
p { margin: 0 0 1rem; }

.wrap { width: min(var(--maxw), 92vw); margin-inline: auto; }

.screen-reader-text {
	position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
	overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ---------- Call popover ---------- */
/* Last-resort fallback only, same as the full pages. Every tel: click
   navigates for real and opens the phone app; this appears afterwards, and
   solely on a desktop that turned out to have no handler registered, where the
   click would otherwise do nothing. */
.callpop {
	position: fixed; z-index: 1200; display: none;
	align-items: center; gap: .6rem;
	padding: .5rem .5rem .5rem .95rem;
	background: rgba(9,26,32,.98); border: 1px solid var(--line);
	border-radius: 999px; box-shadow: var(--shadow);
	font-family: var(--body); font-size: .9rem; color: var(--sand-dim);
	white-space: nowrap;
}
.callpop.is-open { display: inline-flex; }
.callpop strong {
	font-family: var(--head); font-weight: 600; font-size: 1.05rem;
	color: var(--gold-2); letter-spacing: .01em;
}
.callpop button {
	border: 0; cursor: pointer; border-radius: 999px;
	background: var(--gold); color: var(--ink);
	font-family: var(--body); font-weight: 600; font-size: .76rem;
	letter-spacing: .04em; padding: .42rem .9rem;
	transition: background .2s ease;
}
.callpop button:hover { background: var(--gold-2); }
.callpop button:focus-visible { outline: 2px solid var(--sand); outline-offset: 2px; }

/* ---------- Footer ---------- */
.site-footer { background: var(--ink); padding-top: clamp(2.5rem, 5vw, 4rem); }
.site-footer__inner {
	display: flex; align-items: center; justify-content: space-between;
	gap: 1.5rem; flex-wrap: wrap; padding-bottom: 2rem;
}
.site-footer__logo { height: 4rem; width: auto; margin-bottom: .75rem; }
.site-footer__brand p { color: var(--sand-dim); margin: 0; }
.social { display: flex; gap: .75rem; }
.social__link {
	width: 3rem; height: 3rem; border-radius: 50%;
	display: grid; place-items: center;
	color: var(--sand-dim);
	background: rgba(255,255,255,.06);
	border: 1px solid var(--line);
	transition: transform .2s ease, background .2s ease, color .2s ease,
	            border-color .2s ease, box-shadow .2s ease;
}
/* Icons are inline SVG, so they take the chip's colour on hover. */
.social__icon { width: 1.25rem; height: 1.25rem; fill: currentColor; display: block; }
.social__link:hover,
.social__link:focus-visible {
	transform: translateY(-3px);
	color: var(--ink);
	background: var(--gold);
	border-color: var(--gold);
	box-shadow: 0 8px 18px rgba(232,160,75,.32);
}
.social__link:focus-visible { outline: 2px solid var(--gold-2); outline-offset: 3px; }
.site-footer__bar { border-top: 1px solid var(--line); padding: 1.45rem 0; }
.site-footer__bar-inner {
	display: flex; flex-direction: column; align-items: center;
	gap: .8rem; text-align: center;
}
.site-footer__bar p { margin: 0; color: var(--sand-dim); font-size: .85rem; }
/* Plain text credit — no chip, no hover state. The gold name against the
   smaller uppercase label is what carries it. */
.site-footer__credit {
	display: inline-flex; align-items: baseline; gap: .48rem;
	flex-wrap: wrap; justify-content: center;
}
.site-footer__credit-label {
	font-size: .63rem; font-weight: 600; letter-spacing: .17em;
	text-transform: uppercase; color: var(--sand-dim);
}
.site-footer__credit-name {
	font-family: var(--head); font-weight: 700; font-size: .96rem;
	color: var(--gold-2); letter-spacing: .01em;
}
/* Keyboard focus still needs a visible ring — that is focus, not hover. */
.site-footer__credit:focus-visible { outline: 2px solid var(--gold-2); outline-offset: 4px; border-radius: 4px; }

/* ---------- Phone ---------- */
/* Standing on its own, the row's space-between has nothing left to space: the
   brand and the social chips stack, and stacked-but-left-aligned reads as a
   column that lost its other half. Centre them, and let the logo centre with
   them — it is a block image, so it needs the auto margins itself. */
@media (max-width: 620px) {
	.site-footer__inner {
		flex-direction: column; align-items: center;
		text-align: center; gap: 1.25rem;
	}
	.site-footer__logo { margin-inline: auto; }
}
</style>
<!--
  ===========================================================================
  SALTWATER 75 — FOOTER (single file, one Wix module)
  ===========================================================================
  The footer on its own: logo, address and phone, the three social chips, the
  credit bar. Same markup and same CSS as the footer at the bottom of the
  full pages, lifted out so it can be pasted into a Wix HTML embed as its own
  module — the counterpart to the entertainment page's header module, which
  now stops after its banner on phones.

  Paste the whole file into Wix › Embed › HTML iframe, then give the widget
  its height. Measured, with a little slack on top:
    • phone   — 400px  (377 at 500px wide; the address takes a second line
                        on a narrow phone, hence the rounding up)
    • desktop — 350px  (333 at 1280px wide)
  A frame cannot grow itself, so the box has to be tall enough for the
  content. Slack is invisible — the widget is the same colour as the footer —
  so err high rather than low.

  The background is --ink (#0b1f26), the same shade the pages sit on, not the
  #06151a the built-in footer uses. One step up: --ink-2 (#0e2a33).

  Still loaded from the internet:
    • Google Fonts  — Playfair Display + Montserrat
    • Logo          — hot-linked from static.wixstatic.com
  ===========================================================================
-->
</head>
<body>

<footer id="colophon" class="site-footer">
  <div class="wrap site-footer__inner">
    <div class="site-footer__brand">
      <img class="site-footer__logo" src="https://static.wixstatic.com/media/c57fb0_ff950f6488bf48a5b535d179ea75521a~mv2.png" alt="Saltwater 75">
      <p>115 75th Street, Ocean City, MD 21842<br><a href="tel:+14105247575">410-524-7575</a></p>
    </div>
    <nav class="social" aria-label="Social">
      <a class="social__link" href="https://www.instagram.com/saltwater75oc" target="_blank" rel="noopener" aria-label="Instagram"><svg class="social__icon" viewBox="0 0 448 512" aria-hidden="true" focusable="false"><path d="M224.1 141c-63.6 0-114.9 51.3-114.9 114.9s51.3 114.9 114.9 114.9S339 319.5 339 255.9 287.7 141 224.1 141zm0 189.6c-41.1 0-74.7-33.5-74.7-74.7s33.5-74.7 74.7-74.7 74.7 33.5 74.7 74.7-33.6 74.7-74.7 74.7zm146.4-194.3c0 14.9-12 26.8-26.8 26.8-14.9 0-26.8-12-26.8-26.8s12-26.8 26.8-26.8 26.8 12 26.8 26.8zm76.1 27.2c-1.7-35.9-9.9-67.7-36.2-93.9-26.2-26.2-58-34.4-93.9-36.2-37-2.1-147.9-2.1-184.9 0-35.8 1.7-67.6 9.9-93.9 36.1s-34.4 58-36.2 93.9c-2.1 37-2.1 147.9 0 184.9 1.7 35.9 9.9 67.7 36.2 93.9s58 34.4 93.9 36.2c37 2.1 147.9 2.1 184.9 0 35.9-1.7 67.7-9.9 93.9-36.2 26.2-26.2 34.4-58 36.2-93.9 2.1-37 2.1-147.8 0-184.8zM398.8 388c-7.8 19.6-22.9 34.7-42.6 42.6-29.5 11.7-99.5 9-132.1 9s-102.7 2.6-132.1-9c-19.6-7.8-34.7-22.9-42.6-42.6-11.7-29.5-9-99.5-9-132.1s-2.6-102.7 9-132.1c7.8-19.6 22.9-34.7 42.6-42.6 29.5-11.7 99.5-9 132.1-9s102.7-2.6 132.1 9c19.6 7.8 34.7 22.9 42.6 42.6 11.7 29.5 9 99.5 9 132.1s2.7 102.7-9 132.1z"/></svg></a>
      <a class="social__link" href="https://www.facebook.com/sw75oc" target="_blank" rel="noopener" aria-label="Facebook"><svg class="social__icon" viewBox="0 0 320 512" aria-hidden="true" focusable="false"><path d="M279.14 288l14.22-92.66h-88.91v-60.13c0-25.35 12.42-50.06 52.24-50.06h40.42V6.26S260.43 0 225.36 0c-73.22 0-121.08 44.38-121.08 124.72v70.62H22.89V288h81.39v224h100.17V288z"/></svg></a>
      <a class="social__link" href="https://www.tiktok.com/@saltwater75s" target="_blank" rel="noopener" aria-label="TikTok"><svg class="social__icon" viewBox="0 0 448 512" aria-hidden="true" focusable="false"><path d="M448 209.91a210.06 210.06 0 0 1-122.77-39.25v178.72A162.55 162.55 0 1 1 185 188.31v89.89a74.62 74.62 0 1 0 52.23 71.18V0h88a121.18 121.18 0 0 0 1.86 22.17 122.18 122.18 0 0 0 53.91 80.22 121.43 121.43 0 0 0 67 20.14z"/></svg></a>
    </nav>
  </div>
  <div class="site-footer__bar">
    <div class="wrap site-footer__bar-inner">
      <a class="site-footer__credit" href="https://www.welschmarketing.com" target="_blank" rel="noopener">
        <span class="site-footer__credit-label">Built by</span>
        <span class="site-footer__credit-name">Welsch Marketing</span>
      </a>
      <p>&copy; 2026 by Saltwater 75</p>
    </div>
  </div>
</footer>

<script>
/**
 * Saltwater 75 — footer module.
 * Frame-scale correction and tel: handling, both lifted from the full pages.
 */
(function () {
	'use strict';

	// Running inside an iframe (a Wix HTML embed) changes what a pixel means.
	var framed;
	try {
		framed = window.self !== window.top;
	} catch (e) {
		framed = true;   // cross-origin access threw, which itself means framed
	}

	/* A frame lays out at the WIDGET's width, not the device's, and the host
	   then paints that frame at whatever size it likes. Wix's mobile view is
	   the case that bites: it lays an embed out on a narrow grid and stretches
	   the result across the whole phone screen, magnifying every rem in this
	   file — the logo and the social chips come out oversized even though
	   their proportions are right. A <meta viewport> cannot fix it, since that
	   tag is ignored inside an iframe.

	   The magnification is knowable, though. screen.width is the real device
	   width and stays readable from inside a frame, so the factor is simply
	   device width ÷ our layout width. Shrinking the root font size by exactly
	   that factor cancels it out. */
	function syncFrameScale() {
		var layoutW = document.documentElement.clientWidth;
		var deviceW = (window.screen && window.screen.width) || 0;
		var scale   = 1;

		/* Phones only. A desktop Wix page hands its embed a roughly 980px frame
		   and draws it at life size inside a much wider screen — no
		   magnification, so the same ratio there would shrink a perfectly good
		   desktop footer by a third. */
		if (layoutW && deviceW && deviceW <= 820 && layoutW < deviceW) {
			// Clamped: a bad reading must never shrink the module to nothing.
			scale = Math.max(0.7, layoutW / deviceW);
		}
		document.documentElement.style.fontSize = (16 * scale) + 'px';
	}

	if (framed) {
		document.documentElement.classList.add('is-framed');
		syncFrameScale();
		// Rotating the phone changes both readings.
		window.addEventListener('resize', syncFrameScale);
		window.addEventListener('orientationchange', syncFrameScale);
	}

	/* ---- tel: links --------------------------------------------------------
	   The number gets the real tel: navigation, so it hands off to whatever
	   places calls there: the dialer on a phone, FaceTime on a Mac, the
	   registered handler on Windows. Inside a Wix embed the handoff has to be
	   aimed at the top document, or the frame swallows it and the link does
	   nothing.

	   The one real gap is a desktop with no handler registered at all, where
	   the click is silently ignored. Nothing can ask the browser whether a
	   handler exists, so infer it: handing off to another app takes focus away
	   from the page. If focus is still here a beat later, no app opened, and
	   only then does the number appear with a copy button. */
	if (framed) {
		document.querySelectorAll('a[href^="tel:"]').forEach(function (a) {
			a.setAttribute('target', '_top');
		});
	}

	if (!window.matchMedia('(hover: none) and (pointer: coarse)').matches) {
		var PHONE = '410-524-7575';
		var pop = document.createElement('div');
		pop.className = 'callpop';
		pop.setAttribute('role', 'dialog');
		pop.setAttribute('aria-label', 'Call ' + PHONE);
		pop.innerHTML = '<strong>' + PHONE + '</strong><button type="button">Copy</button>';
		document.body.appendChild(pop);

		var copyBtn = pop.querySelector('button');
		var hidePop = function () { pop.classList.remove('is-open'); };
		var timer   = null;
		var disarm  = function () { if (timer) { clearTimeout(timer); timer = null; } };

		// Focus leaving the page means an app took the call: stand down.
		window.addEventListener('blur', disarm);
		window.addEventListener('pagehide', disarm);
		document.addEventListener('visibilitychange', function () { if (document.hidden) disarm(); });

		var showPop = function (r) {
			pop.classList.add('is-open');
			var pw = pop.offsetWidth;
			pop.style.top  = Math.min(r.bottom + 10, window.innerHeight - 60) + 'px';
			pop.style.left = Math.max(10, Math.min(r.left + r.width / 2 - pw / 2,
			                                       window.innerWidth - pw - 10)) + 'px';
			copyBtn.textContent = 'Copy';
		};

		document.addEventListener('click', function (e) {
			var el = e.target.closest ? e.target : e.target.parentElement;
			var link = el && el.closest ? el.closest('a[href^="tel:"]') : null;
			if (link) {
				// No preventDefault: the browser navigates and the dialer opens.
				var r = link.getBoundingClientRect();
				disarm();
				hidePop();
				timer = setTimeout(function () {
					timer = null;
					if (document.hasFocus && !document.hasFocus()) return;
					showPop(r);
				}, 1500);
				return;
			}
			if (!pop.contains(e.target)) hidePop();
		});

		copyBtn.addEventListener('click', function () {
			var done = function (m) {
				copyBtn.textContent = m;
				setTimeout(function () { copyBtn.textContent = 'Copy'; }, 1600);
			};
			if (navigator.clipboard && navigator.clipboard.writeText) {
				navigator.clipboard.writeText(PHONE).then(function () { done('Copied'); })
				                                    .catch(function () { done('Select it'); });
			} else { done('Select it'); }
		});

		document.addEventListener('keydown', function (e) {
			if (e.key === 'Escape') { disarm(); hidePop(); }
		});
	}
})();
</script>
</body>
</html>
