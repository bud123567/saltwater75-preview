<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saltwater 75 Nav</title>
<!--
  ===========================================================================
  SALTWATER 75 — NAV BAR FOR WIX "EMBED"
  ===========================================================================

  TWO WAYS TO USE THIS

  A) Paste the code (easiest)
     Wix Editor → Add (+) → Embed Code → Embed HTML → "Code"
     Paste this entire file → Update

  B) Embed a Site (if you'd rather host the file)
     Upload this file somewhere HTTPS, then
     Add (+) → Embed Code → Embed HTML → "Website address" → paste the URL

  THEN SET THE BOX SIZE — this matters, the bar is only as big as its box:
     Stretch the element to full width.
     Height: 104 px   (desktop)   — anything less clips the bar.

  WHY THIS LOOKS SIMPLER THAN THE OTHER VERSION
  A Wix embed is a sandboxed iframe: a box sitting in the page. It cannot
  float over your site, so it does NOT stick to the top when you scroll, and
  a dropdown would be cut off at the edge of the box. Store and Contact
  therefore link straight to their landing pages instead of opening menus.
  If you want a sticky bar with real dropdowns, that needs the Custom Code
  version (Settings → Custom Code) rather than an embed.

  Every link uses target="_top" so it navigates your whole site, not just
  the little box.
  ===========================================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
    background: #0b1f26;
    overflow: hidden;                 /* the box never gets its own scrollbar */
  }

  .bar { height: 100%; display: flex; flex-direction: column; background: #0b1f26; }

  /* ---------- contact strip ---------- */
  .strip {
    background: rgba(6,18,22,.55);
    border-bottom: 1px solid rgba(246,239,228,.14);
    flex: none;
  }
  .strip-inner {
    width: min(1180px, 96%); margin: 0 auto;
    display: flex; align-items: center; justify-content: flex-end;
    gap: 1.5rem; padding: .35rem 0;
  }
  .strip a {
    display: inline-flex; align-items: center; gap: .4rem;
    color: #cfe0dd; font-size: .74rem; font-weight: 500;
    text-decoration: none; white-space: nowrap;
  }
  .strip a:hover { color: #f2c078; }
  .strip svg { width: 11px; height: 11px; fill: currentColor; flex: none; }
  .strip .addr { margin-right: auto; }

  /* ---------- main row ---------- */
  .main {
    flex: 1; min-height: 0;
    width: min(1180px, 96%); margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  }
  /* On desktop the wrapper dissolves so logo / links / button are all direct
     flex items of .main; order puts the button last despite the DOM order,
     which the phone layout depends on. */
  .toprow { display: contents; }
  .logo    { order: 1; }
  .links   { order: 2; }
  .reserve { order: 3; }

  .logo { flex: none; display: block; }
  .logo img { height: 52px; width: auto; display: block; }

  .links { display: flex; align-items: center; gap: .15rem; min-width: 0; }
  .links a {
    color: #f6efe4; text-decoration: none; white-space: nowrap;
    font-size: .87rem; font-weight: 500; letter-spacing: .02em;
    padding: .5rem .7rem; border-radius: 8px;
  }
  .links a:hover { color: #f2c078; background: rgba(232,160,75,.10); }

  .reserve {
    flex: none;
    display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
    background: #e8a04b; color: #0b1f26; text-decoration: none;
    font-weight: 600; font-size: .8rem; letter-spacing: .03em;
    padding: .55rem 1.05rem; border-radius: 999px; white-space: nowrap;
    transition: background .2s ease, transform .15s ease;
  }
  .reserve:hover { background: #f2c078; transform: translateY(-1px); }
  .reserve svg { width: 1em; height: 1em; fill: currentColor; flex: none; }

  /* ---------- tablet ---------- */
  @media (max-width: 1000px) {
    .links a { font-size: .8rem; padding: .5rem .45rem; }
    .logo img { height: 44px; }
  }

  /* ---------- phone ----------
     No drawer is possible inside a fixed-height box, so the links become a
     single row you swipe sideways. Set the element height to ~132px on the
     Wix MOBILE editor so both rows fit. */
  @media (max-width: 700px) {
    .strip .addr { display: none; }
    .strip-inner { justify-content: center; }
    .main {
      flex-direction: column; align-items: stretch;
      gap: .35rem; padding: .4rem 0; width: 100%;
    }
    /* wrapper comes back so logo + button share the top row, links below */
    .toprow {
      display: flex; align-items: center; justify-content: space-between;
      gap: .75rem; width: min(1180px, 94%); margin: 0 auto; order: 1;
    }
    .links { order: 2; }
    .logo img { height: 38px; }
    .links {
      gap: 0; overflow-x: auto; overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;                       /* Firefox */
      padding: 0 3vw .1rem;
      /* fade the right edge so it reads as "more, keep swiping" */
      -webkit-mask-image: linear-gradient(to right, #000 88%, transparent 100%);
              mask-image: linear-gradient(to right, #000 88%, transparent 100%);
    }
    .links::-webkit-scrollbar { display: none; }   /* Chrome / Safari */
    .links a { font-size: .78rem; padding: .35rem .6rem; }
    .reserve { padding: .5rem .85rem; font-size: .75rem; }
  }

  /* very narrow: drop the button label, keep the dial action */
  @media (max-width: 400px) {
    .reserve { width: 38px; height: 38px; padding: 0; border-radius: 50%; }
    .reserve span { display: none; }
  }
</style>
</head>
<body>

<div class="bar">

    <nav class="links" aria-label="Primary">
      <a href="https://www.saltwater75.com/" target="_top">Home</a>
      <a href="https://www.saltwater75.com/happy-hour" target="_top">Happy Hour</a>
      <a href="https://www.saltwater75.com/general-5" target="_top">Menu</a>
      <a href="https://www.saltwater75.com/shop" target="_top">Store</a>

      <a href="https://www.saltwater75.com/contact" target="_top">Contact</a>
    </nav>
  </div>

</div>

</body>
</html>
