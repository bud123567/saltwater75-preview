<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SW75 — Hero</title>
<!-- WIX EMBED · HERO
     Add (+) → Embed Code → Embed HTML → Code → paste this file.
     Box size:  full width · 600 px tall (desktop) · 540 px (mobile editor)
     All links use target="_top" so they navigate the whole site. -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font-family:'Montserrat',Helvetica,Arial,sans-serif;background:#0b1f26;color:#f6efe4;overflow:hidden}
img{max-width:100%;height:auto;display:block}
a{text-decoration:none}

.hero{
  position:relative;height:100%;display:grid;place-items:center;text-align:center;
  background-image:url('https://static.wixstatic.com/media/8b7d81_20399a78150d4aa5bd46b15175849306~mv2.jpg');
  background-size:cover;background-position:center 58%;
}
/* Shade pooled behind the text so the corners keep their sunset colour. */
.hero::after{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(58% 46% at 50% 54%,rgba(6,18,22,.60),transparent 72%),
    linear-gradient(180deg,rgba(6,18,22,.62) 0%,rgba(6,18,22,.20) 30%,rgba(6,18,22,.34) 58%,rgba(11,31,38,.80) 100%);
}
/* Top padding clears the see-through nav floating over this embed, so the
   copy sits centred in the space BELOW the bar rather than under it. */
.inner{position:relative;z-index:2;padding:7rem 1.25rem 2.5rem;max-width:760px}
.logo{margin:0 auto 1rem;max-height:120px;width:auto;filter:drop-shadow(0 2px 14px rgba(0,0,0,.6))}
.tagline{
  font-family:'Playfair Display',Georgia,serif;font-style:italic;
  font-size:clamp(1.6rem,4.5vw,2.6rem);color:#e8a04b;margin:0 0 .5rem;
}
.sub{font-size:clamp(.95rem,2vw,1.15rem);color:#cfe0dd;margin:0 auto 1.75rem;max-width:520px}
.actions{display:flex;gap:.85rem;justify-content:center;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  border:2px solid transparent;font-weight:600;letter-spacing:.04em;font-size:.88rem;
  padding:.8rem 1.6rem;border-radius:999px;transition:background .2s,transform .15s,color .2s;
}
.btn svg{width:1em;height:1em;fill:currentColor}
.solid{background:#e8a04b;color:#0b1f26}
.solid:hover{background:#f2c078;transform:translateY(-2px)}
.ghost{border-color:#f6efe4;color:#f6efe4}
.ghost:hover{background:#f6efe4;color:#0b1f26;transform:translateY(-2px)}

/* Phones: the vw terms in the clamps above collapse to almost nothing at this
   width, so everything bottoms out at its minimum and reads small. */
@media (max-width:768px){
  .logo{max-height:118px;margin-bottom:1.1rem}
  .tagline{font-size:1.9rem;margin-bottom:.7rem}
  .sub{font-size:1.06rem;line-height:1.55;max-width:34ch;margin-bottom:1.8rem}
  .btn{font-size:.95rem;padding:.85rem 1.6rem}
}

@media (max-width:600px){
  /* The bar is shorter on phones, so less clearance is needed. */
  .inner{padding:6rem 1.25rem 2rem}
  .logo{max-height:104px}
  .tagline{font-size:1.72rem}
  .sub{font-size:1.02rem}
  .actions{flex-direction:column;align-items:center;gap:.7rem}
  .btn{width:100%;max-width:290px}
}
</style>
</head>
<body>
<section class="hero">
  <div class="inner">
    <img class="logo" src="https://static.wixstatic.com/media/c57fb0_ff950f6488bf48a5b535d179ea75521a~mv2.png" alt="Saltwater 75">
    <p class="tagline">bayfront dining</p>
    <p class="sub">Fresh seafood, cold drinks &amp; the best sunset view in Ocean City.</p>
    <div class="actions">
      <a class="btn solid" href="tel:+14105247575" aria-label="Make a reservation — call 410-524-7575">
        <svg viewBox="0 0 512 512" aria-hidden="true"><path d="M164.9 24.6c-7.7-18.6-28-28.5-47.4-23.2l-88 24C12.1 30.2 0 46 0 64c0 247.4 200.6 448 448 448 18 0 33.8-12.1 38.6-29.5l24-88c5.3-19.4-4.6-39.7-23.2-47.4l-96-40c-16.3-6.8-35.2-2.1-46.3 11.6L304.7 368C234.3 334.7 177.3 277.7 144 207.3L193.3 167c13.7-11.2 18.4-30 11.6-46.3l-40-96z"/></svg>
        <span>Make a Reservation</span>
      </a>
      <a class="btn ghost" href="https://www.saltwater75.com/general-5" target="_top">View the Menu</a>
    </div>
  </div>
</section>
</body>
</html>
