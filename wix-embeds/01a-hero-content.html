<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SW75 — Hero content only</title>
<!-- ===========================================================================
     WIX EMBED · HERO CONTENT ONLY  (logo + tagline + buttons)

     This has NO background of its own — it is fully transparent, so whatever
     is behind it in Wix shows through.

     HOW TO USE IT
     1. In the Wix Editor, set the SECTION background to the sunset photo
        (select the section → Replace Background → upload/choose the image).
     2. Add (+) → Embed Code → Embed HTML → Code → paste this file.
     3. Stretch it to full width and drag it over the section background.
     4. Height:  desktop 420 px    mobile editor 470 px

     If the embed shows up as a white box instead of transparent, the section
     behind it is empty — put the background on the SECTION, not on the embed.

     Pair with 01b-hero-bg.html if you'd rather the photo came from an embed
     too. All links use target="_top" so they navigate the whole site.
     =========================================================================== -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
/* transparent all the way down so the Wix background behind shows through */
html,body{margin:0;padding:0;height:100%;background:transparent}
body{font-family:'Montserrat',Helvetica,Arial,sans-serif;color:#f6efe4}
a{text-decoration:none}
img{display:block;max-width:100%}

.wrap{
  height:100%;display:grid;place-items:center;text-align:center;
  padding:1rem 1.25rem;
}
.inner{max-width:720px}

.logo{
  width:clamp(210px,34vw,320px);margin:0 auto 1rem;
  /* the shadow is what separates it from a busy photo behind */
  filter:drop-shadow(0 6px 24px rgba(0,0,0,.7));
}
.tagline{
  font-family:'Playfair Display',Georgia,serif;font-style:italic;
  font-size:clamp(1.4rem,3.4vw,2.1rem);color:#f2c078;
  margin:0 0 .6rem;letter-spacing:.03em;
  text-shadow:0 2px 18px rgba(6,18,22,.9),0 1px 3px rgba(6,18,22,.7);
}
.sub{
  font-size:clamp(.95rem,1.9vw,1.15rem);color:#f6efe4;
  margin:0 auto 1.7rem;max-width:520px;
  text-shadow:0 2px 14px rgba(6,18,22,.85),0 1px 3px rgba(6,18,22,.6);
}
.cta{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  border:2px solid transparent;font-weight:600;font-size:.88rem;letter-spacing:.04em;
  padding:.78rem 1.55rem;border-radius:999px;
  transition:background .2s,transform .15s,color .2s;
}
.btn svg{width:1em;height:1em;fill:currentColor}
.solid{background:#e8a04b;color:#0b1f26;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.solid:hover{background:#f2c078;transform:translateY(-2px)}
.ghost{border-color:#f6efe4;color:#f6efe4;text-shadow:0 1px 6px rgba(6,18,22,.7)}
.ghost:hover{background:#f6efe4;color:#0b1f26;transform:translateY(-2px);text-shadow:none}

/* Phones: the vw terms collapse to nothing at this width, so set real sizes. */
@media (max-width:768px){
  .logo{width:min(74vw,310px);margin-bottom:1.1rem}
  .tagline{font-size:1.9rem;margin-bottom:.7rem}
  .sub{font-size:1.06rem;line-height:1.55;max-width:34ch;margin-bottom:1.8rem}
  .btn{font-size:.95rem;padding:.85rem 1.6rem}
}
@media (max-width:520px){
  .logo{width:min(78vw,290px)}
  .tagline{font-size:1.72rem}
  .sub{font-size:1.02rem}
  .cta{flex-direction:column;align-items:center;gap:.7rem}
  .btn{width:100%;max-width:290px}
}

/* desktop call popover — see the note in the script below */
.callpop{
  position:fixed;z-index:9;display:none;align-items:center;gap:.65rem;
  background:rgba(9,26,32,.98);color:#f6efe4;
  border:1px solid rgba(246,239,228,.18);border-radius:999px;
  padding:.45rem .45rem .45rem 1.1rem;box-shadow:0 18px 45px rgba(0,0,0,.55);
  font-size:1rem;font-weight:600;white-space:nowrap;
}
.callpop.open{display:flex}
.callpop button{
  background:#e8a04b;color:#0b1f26;border:0;border-radius:999px;
  padding:.4rem .9rem;font:inherit;font-size:.78rem;cursor:pointer;
}
.callpop button:hover{background:#f2c078}
</style>
</head>
<body>
<div class="wrap">
  <div class="inner">
    <img class="logo" src="https://static.wixstatic.com/media/c57fb0_ff950f6488bf48a5b535d179ea75521a~mv2.png" alt="Saltwater 75">
    <p class="tagline">bayfront dining</p>
    <p class="sub">Fresh seafood, cold drinks &amp; the best sunset view in Ocean City.</p>
    <div class="cta">
      <a class="btn solid" href="tel:+14105247575" aria-label="Make a reservation — call 410-524-7575">
        <svg viewBox="0 0 512 512" aria-hidden="true"><path d="M164.9 24.6c-7.7-18.6-28-28.5-47.4-23.2l-88 24C12.1 30.2 0 46 0 64c0 247.4 200.6 448 448 448 18 0 33.8-12.1 38.6-29.5l24-88c5.3-19.4-4.6-39.7-23.2-47.4l-96-40c-16.3-6.8-35.2-2.1-46.3 11.6L304.7 368C234.3 334.7 177.3 277.7 144 207.3L193.3 167c13.7-11.2 18.4-30 11.6-46.3l-40-96z"/></svg>
        <span>Make a Reservation</span>
      </a>
      <a class="btn ghost" href="https://www.saltwater75.com/general-5" target="_top">View the Menu</a>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  /* Phones open the dialer straight from the tel: href, so they're left alone.
     Desktops usually can't place a call, so show the number with a copy button
     rather than firing a link that goes nowhere. */
  if (window.matchMedia('(hover: none) and (pointer: coarse)').matches) return;

  var PHONE = '410-524-7575';
  var pop = document.createElement('div');
  pop.className = 'callpop';
  pop.setAttribute('role', 'dialog');
  pop.setAttribute('aria-label', 'Call ' + PHONE);
  pop.innerHTML = '<span>' + PHONE + '</span><button type="button">Copy</button>';
  document.body.appendChild(pop);

  var copyBtn = pop.querySelector('button');
  function hide() { pop.classList.remove('open'); }

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target : e.target.parentElement;
    var link = el && el.closest ? el.closest('a[href^="tel:"]') : null;
    if (link) {
      e.preventDefault();
      var r = link.getBoundingClientRect();
      pop.classList.add('open');
      var pw = pop.offsetWidth;
      pop.style.top  = Math.min(r.bottom + 10, window.innerHeight - 60) + 'px';
      pop.style.left = Math.max(10, Math.min(r.left + r.width / 2 - pw / 2,
                                             window.innerWidth - pw - 10)) + 'px';
      copyBtn.textContent = 'Copy';
      return;
    }
    if (!pop.contains(e.target)) hide();
  });

  copyBtn.addEventListener('click', function () {
    var done = function (m) {
      copyBtn.textContent = m;
      setTimeout(function () { copyBtn.textContent = 'Copy'; }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(PHONE).then(function () { done('Copied'); })
                                          .catch(function () { done('Select it'); });
    } else { done('Select it'); }
  });

  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hide(); });
})();
</script>
</body>
</html>
