<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SW75 — Hero background only</title>
<!-- ===========================================================================
     WIX EMBED · HERO BACKGROUND ONLY  (the sunset photo, no text)

     Only needed if you'd rather the photo came from an embed than from Wix's
     own section background. If you can set the section background in the Wix
     Editor (select section → Replace Background), do that instead — it will
     size and behave better than an iframe.

     Height:  desktop 560 px    mobile editor 620 px
     Place 01a-hero-content.html on top of it.

     The image is hot-linked from the Wix CDN, same as your live site.
     =========================================================================== -->
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0e2a33}

.bg{position:relative;height:100%;overflow:hidden}
/* Inset past the edges so the slow scale-up never exposes a bare corner. */
.bg::before{
  content:"";position:absolute;inset:-4%;
  background:url('https://static.wixstatic.com/media/8b7d81_20399a78150d4aa5bd46b15175849306~mv2.jpg') center 58%/cover no-repeat;
  transform:scale(1.02);
  animation:drift 32s ease-in-out infinite alternate;
}
@keyframes drift{from{transform:scale(1.02)}to{transform:scale(1.11)}}

/* Shade pooled through the middle so text placed on top stays readable, with
   the corners left bright and a fade into the site colour at the bottom. */
.bg::after{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(58% 44% at 50% 52%,rgba(6,18,22,.60),transparent 74%),
    linear-gradient(180deg,rgba(6,18,22,0) 0%,rgba(6,18,22,.10) 40%,
                    rgba(11,31,38,.80) 100%);
}

@media (prefers-reduced-motion: reduce){
  .bg::before{animation:none;transform:scale(1.02)}
}
</style>
</head>
<body>
<div class="bg"></div>
</body>
</html>
