<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Montserrat',Helvetica,Arial,sans-serif;background:#0b1f26;color:#f6efe4;line-height:1.65}

.section{padding:clamp(2rem,5vw,3.5rem) 0}
.wrap{width:min(1180px,92%);margin:0 auto}
.head{text-align:center;max-width:640px;margin:0 auto clamp(1.5rem,3vw,2.25rem)}
.eyebrow{
  display:inline-block;font-weight:600;letter-spacing:.28em;text-transform:uppercase;
  font-size:.72rem;color:#e8a04b;margin-bottom:.6rem;
}
h2{
  font-family:'Playfair Display',Georgia,serif;font-weight:700;line-height:1.15;
  font-size:clamp(1.6rem,3.4vw,2.5rem);margin:0;
}
.grid{display:grid;gap:.85rem;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));align-items:start}
figure{
  margin:0;padding:1.25rem;border-radius:14px;
  background:rgba(255,255,255,.04);border:1px solid rgba(246,239,228,.14);
}
.stars{color:#e8a04b;font-size:.9rem;letter-spacing:.12em;margin-bottom:.5rem}
blockquote{margin:0 0 .75rem;font-size:.88rem;color:#cfe0dd}
figcaption{font-size:.8rem;font-weight:600;color:#f6efe4}
</style>
</head>
